# Keeps the "Last 3 pushes" table in README.md up to date.
# Runs after every push to main and again when "Publish site" finishes, so the Site column
# shows the final result. Its own README commit is made with the workflow token, which never
# starts another workflow run, and it is left out of the table.
name: Update push log

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Publish site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: push-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Rebuild the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-log.sh

      - name: Save it
        run: |
          if git diff --quiet README.md; then echo "Push log already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update push log in README" README.md
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
